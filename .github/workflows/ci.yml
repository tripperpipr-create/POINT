name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Documentation contracts
        run: |
          node scripts/check-docs.mjs
          node scripts/check-quality-gate.mjs
          node scripts/check-release-contracts.mjs

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Verify modules
        run: go mod verify
      - name: Test
        run: go test ./...

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build immutable execution image
        run: docker build --pull -f Dockerfile.sandbox -t point-agent-sandbox:ci .
      - name: Generate sandbox CycloneDX SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: point-agent-sandbox:ci
          version: 'v0.74.0'
          scanners: vuln
          vuln-type: os,library
          format: cyclonedx
          output: sandbox-sbom.cdx.json
          exit-code: '0'
      - name: Reject high or critical sandbox-image vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: point-agent-sandbox:ci
          version: 'v0.74.0'
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          format: json
          output: sandbox-trivy.json
          exit-code: '1'
      - name: Verify process, filesystem and controlled egress isolation
        env:
          POINT_SANDBOX_DOCKER_TEST: '1'
          POINT_SANDBOX_IMAGE: point-agent-sandbox:ci
        run: go test ./internal/sandbox -run DockerSandboxIntegration -count=1 -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit

  extension:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev
