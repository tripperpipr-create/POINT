name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Documentation contracts
        run: |
          node scripts/check-docs.mjs
          node scripts/check-quality-gate.mjs
          node scripts/check-release-contracts.mjs

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Verify modules
        run: go mod verify
      - name: Staticcheck
        # Версия закреплена, а не `@latest`.
        #
        # Линтер, который обновляется сам, покраснеет на коммите, который
        # ничего такого не делал, и разбор начнётся с поиска своей ошибки там,
        # где её нет. Набор проверок — в `staticcheck.conf` в корне.
        #
        # `go run pkg@version` скачает тулчейн 1.26 — этой версии staticcheck
        # нужен именно он, хотя сам проект собирается 1.25 из go.mod.
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: Test
        # Имена упавших тестов уходят в сводку прогона.
        #
        # Журналы Actions видны только после входа в аккаунт, и снаружи
        # падение выглядит как «Process completed with exit code 1» — по нему
        # нельзя понять ни какой тест упал, ни повторяем ли отказ. Сводка
        # прогона публична, и этих двух строк хватает, чтобы разбор начинался
        # с имени теста, а не с воспроизведения вслепую.
        #
        # `-count=1` — по той же причине, по которой он стоит в релизном
        # затворе: кэш результатов умеет ответить «PASS» за тест, который в этот
        # раз не запускался, а разбор плавающего отказа требует, чтобы каждый
        # прогон был настоящим.
        #
        # Сводка ловит не только `--- FAIL`. Самые неприятные отказы — те, что
        # роняют весь двоичный файл: `fatal error: concurrent map read and map write`,
        # `panic:` из чужой горутины, `test timed out`. У них нет ни одной строки
        # `--- FAIL`, и снаружи они выглядят как молчаливый «exit code 1» — то есть
        # ровно так, как выглядел плавающий отказ 18 сентября.
        run: |
          set +e
          go test ./... -count=1 -timeout 25m -coverprofile=coverage.out 2>&1 | tee go-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo '### Упавшие тесты'
              echo '```'
              grep -E '^(--- FAIL|    --- FAIL|FAIL|panic:|fatal error:)|test timed out' go-test.log | head -50
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Coverage
        # Замер без порога и намеренно.
        #
        # Порог на восьмидесяти тысячах строк превращается в игру с цифрой:
        # его добирают тестами на то, что легче покрыть, а не на то, что важнее
        # проверить. Сводка нужна, чтобы перекос был виден вслух: сегодня
        # слабее всего покрыт `internal/domain` — пакет, на который ссылается
        # всё остальное дерево.
        if: always()
        run: |
          test -f coverage.out || exit 0
          {
            echo '### Покрытие'
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Race
        # Отдельным шагом, а не флагом к основному прогону.
        #
        # Локально детектор не запускался ни разу: сборка идёт с CGO_ENABLED=0
        # и gcc в PATH нет. На ubuntu-раннере gcc есть, то есть единственное место,
        # где проверка вообще возможна, — здесь. Отдельным шагом потому, что
        # он заметно медленнее, и его отказ должен читаться отдельно от отказа
        # обычного прогона.
        #
        # Срок задан явно: `internal/app` идёт около трёх минут без детектора,
        # а с ним легко переваливает за десять минут по умолчанию. Без явного срока
        # шаг падал бы по таймауту и читался как найденная гонка.
        run: |
          set +e
          go test ./internal/... -race -count=1 -timeout 45m 2>&1 | tee go-race.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo '### Гонки и отказы под детектором'
              echo '```'
              grep -E '^(--- FAIL|    --- FAIL|FAIL|panic:|fatal error:|WARNING: DATA RACE)|test timed out' go-race.log | head -50
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build immutable execution image
        run: docker build --pull -f Dockerfile.sandbox -t point-agent-sandbox:ci .
      - name: Build and verify Node runtime packs
        run: |
          for major in 20 22; do
            docker build --pull -f Dockerfile.sandbox-node --build-arg NODE_MAJOR="$major" -t "point-agent-sandbox-node${major}:1.0.0" .
            docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges=true --user 10001:10001 "point-agent-sandbox-node${major}:1.0.0" node --version | grep -E "^v${major}\."
            docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges=true --user 10001:10001 "point-agent-sandbox-node${major}:1.0.0" npm --version | grep -Fx '10.9.9'
          done
      - name: Generate sandbox CycloneDX SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: point-agent-sandbox:ci
          version: 'v0.74.0'
          scanners: vuln
          vuln-type: os,library
          format: cyclonedx
          output: sandbox-sbom.cdx.json
          exit-code: '0'
      - name: Reject high or critical sandbox-image vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: point-agent-sandbox:ci
          version: 'v0.74.0'
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          format: json
          output: sandbox-trivy.json
          exit-code: '1'
      # Пакеты Node 20/22 подбираются для проектов, требующих npm 10 (TODO Q04,
      # Q18). Их пакеты ОС проходят тот же затвор HIGH/CRITICAL. Внутренние
      # библиотеки самого npm 10.9.9 (pacote, sigstore и др.) чинятся только
      # в npm 11, поэтому по ним — отчёт без отказа.
      - name: Reject high or critical OS vulnerabilities in Node 20 pack
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: point-agent-sandbox-node20:1.0.0
          version: 'v0.74.0'
          scanners: vuln
          vuln-type: os
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Reject high or critical OS vulnerabilities in Node 22 pack
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: point-agent-sandbox-node22:1.0.0
          version: 'v0.74.0'
          scanners: vuln
          vuln-type: os
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Report npm library vulnerabilities in Node packs
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: point-agent-sandbox-node20:1.0.0
          version: 'v0.74.0'
          scanners: vuln
          vuln-type: library
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Verify process, filesystem and controlled egress isolation
        env:
          POINT_SANDBOX_DOCKER_TEST: '1'
          POINT_SANDBOX_IMAGE: point-agent-sandbox:ci
        run: go test ./internal/sandbox -run 'DockerSandboxIntegration|DockerRuntimeVersionsIntegration' -count=1 -v
      - name: Verify Node 20 sandbox boundary
        env:
          POINT_SANDBOX_DOCKER_TEST: '1'
          POINT_SANDBOX_IMAGE: point-agent-sandbox-node20:1.0.0
          POINT_SANDBOX_EXPECT_NPM: '10.9.9'
        run: |
          export POINT_SANDBOX_EXPECT_NODE="$(docker run --rm --network none point-agent-sandbox-node20:1.0.0 node --version)"
          go test ./internal/sandbox -run DockerSandboxIntegration -count=1 -v

      - name: Build static volume helper and verify warm sandbox
        env:
          POINT_VOLUME_INTEGRATION: '1'
          POINT_SANDBOX_IMAGE: point-agent-sandbox:ci
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/point-sandboxd" ./cmd/point-sandboxd
          export POINT_SANDBOXD_BINARY="$RUNNER_TEMP/point-sandboxd"
          go test ./internal/sandbox ./internal/agent -run 'TestVolume.*Integration' -count=1 -v

  sandbox-portability:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go test ./internal/filepolicy ./internal/sandboxsync ./internal/workspace ./internal/sandbox -count=1

  runtime-tooling:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Verify pack, resource accounting and observation evidence
        env:
          POINT_METRICS_NATIVE: '1'
        run: python scripts/test-point-runtime-tooling.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit

  extension:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev
