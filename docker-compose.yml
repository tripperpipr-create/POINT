services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATA_DIR: /data
      WORKSPACE_ROOT: /workspace
      HTTP_ADDR: 0.0.0.0:8080
      REDIS_ADDR: redis:6379
      POINT_API_TOKEN: ${POINT_API_TOKEN:-point-docker-dev-token-change-me}
      DEFAULT_OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - workbench-data:/data
      - ${WORKSPACE_PATH:-./examples/go-health}:/workspace:rw
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      POINT_API_TOKEN: ${POINT_API_TOKEN:-point-docker-dev-token-change-me}
    ports:
      - "127.0.0.1:${WORKBENCH_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  workbench-data:
  redis-data:
