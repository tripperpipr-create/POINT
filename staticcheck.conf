# Набор проверок staticcheck.
#
# Включено всё, кроме ST1005 — «строка ошибки не должна начинаться с заглавной».
# Правило написано под англоязычный код, где ошибки складываются в цепочку и
# заглавная буква посреди фразы читается как опечатка. Здесь оно даёт только
# ложные срабатывания: из тридцати находок все тридцать — либо имя собственное
# в начале («Azure OpenAI requires…», «Cursor runtime…», «Point MCP address…»,
# «Auto router…»), что допускает и сам стиль Go, либо русское предложение
# («Мастер не завершил ответ»), к которому правило неприменимо вовсе.
#
# Затвор, который на тридцать находок не несёт ни одной настоящей, перестают
# читать целиком — поэтому правило снято здесь, а не заглушено по месту.
# `inherit` — набор по умолчанию, а не `all`: `all` включает ещё и ST1000/ST1020/ST1021 —
# требования к форме комментариев вида «Package app…». Здесь комментарии
# пишутся по-русски и объясняют причину, а не повторяют имя — эти сто восемьдесят
# замечаний не несут ни одной находки.
#
# SA9003 добавлен сверх умолчания специально: пустая ветвь `if` — это код,
# который выглядит проверяющим и не проверяет ничего. Он нашёл две штуки:
# одну в тесте подключений и одну в боевом коде цикла учения.
checks = ["inherit", "-ST1005", "SA9003"]
